name: repro-needed (comment + close)

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours (UTC)
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      # ------------------------------------------------------------
      # Missing reproduction / missing requested information
      # Warn immediately, close after 7 days.
      # ------------------------------------------------------------
      - name: Handle issues needing information
        uses: actions/stale@v11
        with:
          any-of-issue-labels: "repro needed,info needed"

          days-before-issue-stale: 0
          days-before-issue-close: 7

          stale-issue-label: "stale: needs-info"

          remove-issue-stale-when-updated: true

          stale-issue-message: >
            Thanks for the report. To help us investigate, please follow our
            [Submitting an Issue](https://github.com/ikemen-engine/Ikemen-GO/blob/develop/CONTRIBUTING.md#submit-issue)
            guide and include a minimal reproduction and/or any additional information requested by the maintainers.
            If the requested details aren't provided within 7 days, this issue will be automatically closed.

          close-issue-message: ""
          close-issue-reason: "not_planned"

          days-before-pr-stale: -1
          days-before-pr-close: -1

          operations-per-run: 200

      # ------------------------------------------------------------
      # Maintainers could not reproduce the issue.
      # Allow some time for additional evidence before closing.
      # ------------------------------------------------------------
      - name: Handle non-reproducible issues
        uses: actions/stale@v11
        with:
          any-of-issue-labels: "not reproducible"

          # Nothing new for 30 days -> warning.
          days-before-issue-stale: 30

          # Nothing new for another 7 days -> close.
          days-before-issue-close: 7

          stale-issue-label: "stale: not-reproducible"

          remove-issue-stale-when-updated: true

          stale-issue-message: >
            This issue has been marked as not reproducible and there has been
            no additional activity for 30 days. If you can still reproduce the
            problem, please provide updated reproduction steps, a minimal
            reproduction, or any other information that may help us investigate.
            Otherwise, this issue will be automatically closed in 7 days.

          close-issue-message: ""
          close-issue-reason: "not_planned"

          days-before-pr-stale: -1
          days-before-pr-close: -1

          operations-per-run: 200