	select = select.def
	fight = fight.def
	font0 = Open_Sans.def
	font1 = default-3x5.def
	; Optional settings for each font declared above, e.g. for font0:
	;   font0.height = -1             ; Truetype size, -1 uses the size from the DEF file
	;   font0.glyphs.offset = 0, 0    ; inline glyph position
	;   font0.glyphs.scale = 1.0, 1.0 ; inline glyph size, 1 matches the font height
	;   font0.glyphs.spacing = 0      ; gap where a glyph meets text or another glyph, in font pixels
	; Glyph settings default to the same keys in the [Def] section of the font DEF file.
	; They apply to elements that use the font by its number.
	font0.height = -1
	font0.glyphs.offset = 0, 0
	font0.glyphs.scale = 1.0, 1.0
	font0.glyphs.spacing = 3

