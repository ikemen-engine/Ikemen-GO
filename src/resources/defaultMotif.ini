;-----------------------------------------------------------
; Ver 1.0
; This file contains a list of all available screenpack parameters and the
; default values used by the screenpack definition file.
;
; This file is not loaded by the engine and should not be used as-is. It's
; meant to be a reference for adding parameters to your own screenpack
; system.def file.
;
; Features that didn't exist in Mugen and have non self-explanatory names
; have additional comments (often only the first occurrence of a new
; parameter in this file is commented).
;
;-----------------------------------------------------------
; Notes:
;   - it's good practice to skip inclusion of parameters that you're not
;     using (e.g. window, localcoord, etc.)
;   - by default, all elements are rendered using 240p localcoord.
;     Specifying any parameter for the given element changes localcoord to
;     the screenpack localcoord (unless a custom localcoord is set in the
;     DEF file)
;   - fonts can be specified in the [Files] section (no limit to how many),
;     alternatively, you can point directly to the file path in the parameter:
;     i.e: menu.item.font = font/menu1.def, 0, -1
;   - fonts indexed for system.def do not refer to the ones in fight.def
;   - fonts are searched in directories in the following order:
;     1. system directory (where system.def is located)
;     2. top-level Ikemen directory (not recommended to keep custom fonts
;        here)
;     3. data/ (not recommended to keep custom fonts here)
;     4. font/
;   - font parameters consist of the following arguments:
;       fnt, bank, align, r, g, b, a, height
;     where fnt can be either the index matching the font number declared
;     under [Files] or the font filename (path to file). The height
;     argument is used only by Truetype fonts (if not equal to -1 it
;     overrides both the font<num>.height parameter and the size of the
;     TTF font declared in its DEF file)
;   - the value -1 used as fnt index, anim, or spr/snd group disables them
;   - text enclosed in angle brackets in parameter names should be
;     replaced (including the brackets) with appropriate data, e.g. <pn>
;     can be 1-8.
;   - .col-suffixed params take r, g, b values (default: 255,255,255)
;   - .trans-suffixed params set how animations, text and rectangles blend,
;     as in stage backgrounds: default (their own blending), none, add, add1,
;     addalpha, sub or subadd.
;   - .alpha-suffixed params set source and destination alpha. With .trans, a
;     blank alpha keeps the default factors of that trans type. Rectangles
;     (overlay, boxbg, boxcursor, bgclear) always take their factors from
;     alpha or pulse.
;   - screenpack and storyboard text can change color inline: <color:RRGGBB>
;     switches to a hex color and </> restores the element color, e.g.
;     Press <color:FF0000>Start</> to play
;   - text can show input glyphs: <action:name> what to press for a menu action,
;     <key:NAME> a keyboard key, <input:a> an engine button, <control:A> one action token
;     and <glyph:NAME> a [Glyphs] entry, unchanged by Mirror Commands and Command Display
;   - .action-suffixed params list the controls that trigger a UI action,
;     separated by commas. Controls of the standard virtual controller work
;     the same for keyboards and gamepads, whatever the Controller Setup:
;     DP_U, DP_D, DP_L, DP_R, A, B, X, Y, START, BACK, LB, RB, LT, RT,
;     LS_Y-, LS_Y+, LS_X-, LS_X+, RS_Y-, RS_Y+, RS_X-, RS_X+, LS, RS.
;     KEY:<name> is a local keyboard key, e.g. KEY:DELETE. Remote netplay
;     players can't use it.
;     BTN:<name> is an engine button after the Controller Setup: up, down,
;     left, right, a, b, c, x, y, z, start, d, w, menu, l, r.
;   - .textwrap-suffixed params wrap text at the right edge of its window
;     (the screen without one): w between words, c at any character, n or
;     empty for no wrapping.
;   - .state-suffixed params control the StateNo that a particular player
;     is forced into during the post-match screen. The first existing
;     state will be chosen if more than one state number is specified
;     (separated by commas). An empty value means no state change; -1
;     disables the player from the screen.
;   - animated portraits replace sprite portraits if specified. The value
;     refers to ActionNo in the character's AIR file. Animation respects
;     constant [Size] xscale, yscale values (horizontal/vertical scaling
;     factor).
;
;-----------------------------------------------------------

