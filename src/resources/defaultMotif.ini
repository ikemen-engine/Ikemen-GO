[Controller Glyphs]
	; Per-device artwork. Only group/image differences from <keyboard.*>/<gamepad.*> go here.
	;   controller.<pack>.type            = gamepad (default) or keyboard
	;   controller.<pack>.group           = sprite group holding the artwork
	;   controller.<pack>.gamepad.<token> = image for one gamepad button
	;   controller.<pack>.key.<token>     = image for one key
	;   controller.<pack>.icon            = artwork shown when choosing a pack
	;   controller.<pack>.label           = name shown when choosing a pack
	; Packs are detected from the device or picked in input options. Packs without a label are detection only.
	; Face button images show the A, B, X, Y labels. Each button is drawn with the label printed on the pad.
	; Gamepad groups use the same image number for the same control as <gamepad.*>. A button missing from
	; a pack's group is drawn from the generic one, so a family only needs the art that differs.
	; Images 50 and up are alternatives picked with controller.<pack>.gamepad.<token>, 100 and up are icons.
