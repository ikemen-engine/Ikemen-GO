	; Extended continue screen (legacymode.enabled = 0) renders interactive
	; counter animation, defined as a single 'counter' element. This animation
	; is running between starttime tick up to the endtime tick. skipstart is a
	; delay from starttime before player's button presses are detected.
	; counter.<num>.skiptime points to animation tick that the engine should
	; skip into when action button is pressed (skipping counter numbers).
	; counter.<num>.snd points to animation tick at which corresponding sound
	; should trigger. <num> portion of these parameter names should be replaced
	; with corresponding counter number (there is no limit for amount of these
