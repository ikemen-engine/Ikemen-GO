	; Space-separated keys, with | between rows. Braces name editing actions.
	; Width is in key units, including the spacing between those units.
	layout.lower = q w e r t y u i o p | a s d f g h j k l {backspace} | {shift} z x c v b n m . {done} | {page} {previous} {space} {next} {cancel}
	layout.upper = Q W E R T Y U I O P | A S D F G H J K L {backspace} | {shift} Z X C V B N M . {done} | {page} {previous} {space} {next} {cancel}
	layout.symbols = 1 2 3 4 5 6 7 8 9 0 | @ {hash} $ % & - _ + = {backspace} | {shift} . , : / \ ? ! {pipe} {done} | {page} {previous} {space} {next} {cancel}
	layout.symbolsupper = 1 2 3 4 5 6 7 8 9 0 | [ ] ( ) < > { } ~ {backspace} | {shift} ` ' " {semicolon} : / ? ! {done} | {page} {previous} {space} {next} {cancel}

