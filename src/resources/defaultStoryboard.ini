[SceneDef]
; Ends the storyboard.
done.action = A
; Ends the storyboard like Esc. The screen that started it may go back, e.g. an arcade intro returns to the select screen.
cancel.action = B, BACK
; Finishes the current dialogue line, shows the next one, or skips to the next scene.
skip.action = START
stopmusic = 1
disablecancel = 0
waitforloading = 0
